<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blood Bank Management{% endblock %}</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9;color:#202733}
    header{background:#8b1e2d;color:white;padding:18px 5%;display:flex;justify-content:space-between;flex-wrap:wrap}
    nav a{color:white;margin:0 9px;text-decoration:none}
    main{max-width:1000px;margin:28px auto;padding:0 18px}
    .card{background:white;padding:20px;border-radius:10px;margin:14px 0;box-shadow:0 2px 8px #0001}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
    input,select,textarea{display:block;width:100%;padding:10px;margin:7px 0 14px;box-sizing:border-box}
    button,.btn{background:#8b1e2d;color:white;padding:10px 16px;border:0;border-radius:5px;text-decoration:none;cursor:pointer}
    table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left}
    .msg{background:#e8f5e9;padding:10px;margin:10px 0}.errorlist{color:#a00}
    .muted{color:#5e6875;font-size:.9em}
  </style>
</head>
<body>
<header>
  <strong>🩸 Blood Bank Management</strong>
  <nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'donor_list' %}">Donors</a>
    <a href="{% url 'inventory' %}">Inventory</a>
    <a href="{% url 'request_list' %}">Requests</a>
  </nav>
</header>
<main>
  {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
  <p class="muted">Educational demonstration only. Not for real clinical decisions or blood distribution.</p>
</main>
</body>
</html>
